<section class="card mt-6">
  <h2 class="card-title">Equipamentos</h2>
  <p class="text-xs text-slate-400 mb-3">Máximo de 13 equipamentos.</p>

  <div class="space-y-4">

    <div
      *ngFor="let eq of equipamentos; let i = index; trackBy: trackByIndex"
      class="rounded-xl border border-slate-200 p-4 space-y-3"
    >

      <div>
        <label class="label">Nome</label>
        <input class="input" [(ngModel)]="eq.nome" (ngModelChange)="onChange()" placeholder="Ex: Espada Longa" />
      </div>

      <div>
        <label class="label">Tipo</label>
        <input class="input" [(ngModel)]="eq.tipo" (ngModelChange)="onChange()" placeholder="Ex: Arma pesada" />
      </div>

      <div>
        <label class="label">Dano / Defesa</label>
        <input class="input" [(ngModel)]="eq.danoDefesa" (ngModelChange)="onChange()" placeholder="Ex: 1D8+2" />
      </div>

      <div>
        <label class="label">Observação</label>
        <input class="input" [(ngModel)]="eq.observacao" (ngModelChange)="onChange()" placeholder="Opcional" />
      </div>

      <div class="flex justify-end gap-2 pt-1">
        <button
          *ngIf="equipamentos.length < 13"
          type="button"
          (click)="adicionar()"
          class="w-9 h-9 rounded-lg border border-indigo-300 text-indigo-600 font-bold hover:bg-indigo-50 transition"
        >+</button>

        <button
          *ngIf="i > 0"
          type="button"
          (click)="remover(i)"
          class="w-9 h-9 rounded-lg border border-red-300 text-red-500 font-bold hover:bg-red-50 transition"
        >−</button>
      </div>

    </div>

  </div>
</section>
