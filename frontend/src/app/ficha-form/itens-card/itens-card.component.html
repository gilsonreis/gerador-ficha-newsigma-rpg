<section class="card mt-5">
  <h2 class="card-title">Itens</h2>
  <p class="text-xs text-slate-400 mb-3">Máximo de 11 itens.</p>

  <div class="space-y-2">

    <div
      *ngFor="let item of itens; let i = index; trackBy: trackByIndex"
      class="flex items-center gap-2"
    >
      <input
        type="text"
        [(ngModel)]="itens[i]"
        (ngModelChange)="onItemChange()"
        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500"
        placeholder="Descreva o item..."
      />

      <button
        *ngIf="itens.length < 11"
        type="button"
        (click)="adicionarItem()"
        class="shrink-0 w-9 h-9 rounded-lg border border-indigo-300 text-indigo-600 font-bold hover:bg-indigo-50 transition"
      >+</button>

      <button
        *ngIf="i > 0"
        type="button"
        (click)="removerItem(i)"
        class="shrink-0 w-9 h-9 rounded-lg border border-red-300 text-red-500 font-bold hover:bg-red-50 transition"
      >−</button>
    </div>

  </div>
</section>
